# Default experiment configuration. Every script reads this file; CLI flags override it.
seed: 42
data:
  train_csv: data/train.csv
  test_csv: data/test.csv
validation:
  protocol: grouped        # grouped | stratified  (grouped = duplicates never straddle folds)
  n_splits: 5
  holdout_fraction: 0.2    # used by the single reference run logged to W&B
text:
  max_length: 128
  tail_tokens: 16          # head+tail truncation for pasted tables (0 = plain head truncation)
baselines:
  tfidf:
    word_ngrams: [1, 2]
    char_ngrams: [2, 5]
    C_grid: [0.5, 1.0, 2.0, 4.0, 8.0]
  embeddings:
    models:
      - sentence-transformers/all-MiniLM-L6-v2
      - BAAI/bge-small-en-v1.5
      - intfloat/multilingual-e5-small
    C_grid: [0.5, 1.0, 2.0, 4.0, 8.0]
transformer:
  model_name: distilbert-base-uncased
  batch_size: 16
  eval_batch_size: 64
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_epochs: 8
  patience: 2
  grad_clip: 1.0
  class_weight: sqrt_inv   # none | sqrt_inv | inv
  label_smoothing: 0.0
  dropout: null            # null = model default
  device: auto             # auto | cpu | mps | cuda
calibration:
  method: temperature
  review:
    max_flag_rate: 0.20    # choose the confidence threshold so at most 20% of traffic is flagged
wandb:
  mode: offline            # offline | online | disabled
  project: foursight-intent
